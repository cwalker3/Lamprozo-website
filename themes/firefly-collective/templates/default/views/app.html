<!-- theme/views/app.html -->

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <title>FFC App</title>
        <link rel="stylesheet" href="/wp-content/themes/firefly-collective/templates/default/assets/css/_core_custom-properties.css">
        <link rel="stylesheet" href="/wp-content/themes/firefly-collective/templates/default/assets/css/_core_main.css">
        <link rel="stylesheet" href="/wp-content/themes/firefly-collective/templates/default/assets/css/_core_nav.css">
        <link rel="stylesheet" href="/wp-content/themes/firefly-collective/templates/default/assets/css/_core_default.css">
        <link rel="stylesheet" href="/wp-content/themes/firefly-collective/templates/default/assets/css/_core_animations.css">
        <link rel="stylesheet" href="/wp-content/themes/firefly-collective/templates/default/assets/css/app.css">
        <link rel="stylesheet" href="/wp-content/themes/firefly-collective/templates/default/assets/css/dashboard.css">
        <link rel="stylesheet" href="/wp-content/plugins/firefly-collective/includes/apps/backend/assets/css/orders.css">
        <link rel="manifest" href="/wp-content/themes/firefly-collective/templates/default/manifest.json">
        <script type="text/javascript" src="/wp-content/themes/firefly-collective/templates/default/assets/js/_core_main.js" defer></script>
        <script type="text/javascript" src="/wp-content/themes/firefly-collective/templates/default/assets/js/auth.js" defer></script>
        <script type="text/javascript" src="/wp-content/themes/firefly-collective/templates/default/assets/js/dashboard.js" defer></script>
        <script type="text/javascript" src="/wp-content/themes/firefly-collective/templates/default/assets/js/app.js" defer></script>
        <script type="text/javascript" src="https://js.stripe.com/v3/" defer></script>
        <script type="text/javascript" src="/wp-content/plugins/firefly-collective/includes/apps/backend/assets/js/orders.js" defer></script>
        <script type="text/javascript" src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    </head>
    <body>
        <div id="backdrop"></div>

        <header>
            <div id="nav-bar"></div>
            <div id="logo-name">
                <div id="site-logo"><img src="/wp-content/themes/firefly-collective/templates/default/images/logo.webp" alt="Logo"></div>
                <div id="site-name">Firefly Collective</div>
            </div>
        </header>  

        <div>
            <img id="hamburger" src="/wp-content/themes/firefly-collective/templates/default//images/hamburger.webp" alt="Menu">
        </div>
        <div>
            <img id="close-nav-btn" src="/wp-content/themes/firefly-collective/templates/default/images/close-nav.webp" alt="Close Menu">
        </div>

        <!-- Nav container - menu will be inserted here by JavaScript -->
        <nav>
            <div class="menu-placeholder">
                <p style="color: #666; text-align: center; padding: 2rem;">Loading menu...</p>
            </div>
        </nav>

        <main>
            <div class="content">
                <div id="app-root"></div>
            </div>
        </main>
        
        <!-- Offline indicator -->
        <div class="offline-indicator">You are currently offline. Some features may be limited.</div>

        <div id="pwa-flag"></div>

        <footer>
            <h2>Footer</h2>
        </footer>
        
        <img src="/wp-content/themes/firefly-collective/templates/default/images/loading.gif" id="loader">
    </body>
</html>
